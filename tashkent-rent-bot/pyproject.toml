[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tashkent-rent-bot"
version = "0.1.0"
description = "Personal Telegram rental watcher with conservative filters and quiet delivery scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Telethon>=1.45,<2",
    "tzdata>=2025.1",
]

[tool.setuptools.packages.find]
include = ["rentbot*"]
